<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Bots">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Paper Bots</title>
<style>
:root{--bg:#f2f2f7;--card:#ffffff;--text:#000000;--text2:#3c3c43cc;--sep:#3c3c4329;--fill:#7878801f;--green:#248a3d;--red:#d70015;--blue:#007aff;--orange:#c93400;--tint:#007aff}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--card:#1c1c1e;--text:#ffffff;--text2:#ebebf599;--sep:#54545899;--fill:#7878805c;--green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;--tint:#0a84ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{padding:10px 0 6px}
h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:4px 0 2px}
.sub{color:var(--text2);font-size:15px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--text2);letter-spacing:-.08px;margin:24px 16px 7px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.grow{flex:1;min-width:0}
.name{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:13px;color:var(--text2)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--text2)}
.big{font-size:34px;font-weight:700;letter-spacing:.37px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--fill);margin:4px 6px 0 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text2)}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.warn{background:var(--orange)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill)}
.badge.pass{background:var(--green);color:#fff}.badge.paused{background:var(--orange);color:#fff}
.bar{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--tint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coin{background:var(--card);border-radius:12px;padding:12px 14px}
.coin .t{display:flex;justify-content:space-between;font-weight:600}
.lead{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:2px}
.kv b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.hero{padding:16px}
.hero .k{font-size:13px;color:var(--text2)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:0;color:var(--text2);font:500 10px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;min-height:44px}
.tabs button.on{color:var(--tint)}
.tabs svg{width:26px;height:26px}
section{display:none}section.on{display:block}
.why{font-size:12px;color:var(--text2);margin-top:2px;white-space:normal}
.stale{color:var(--orange)}
</style>
</head>
<body>
<header>
  <div class="sub" id="upd">Connecting…</div>
  <h1 id="title">Overview</h1>
  <div id="pills"></div>
</header>

<section id="t-home" class="on">
  <h2>Champion · $1,000 bank</h2>
  <div class="card" id="champ"></div>
  <h2>Live 5-minute windows</h2>
  <div class="grid" id="live"></div>
  <h2>Dashboards</h2>
  <div class="card" id="totals"></div>
  <h2>Past champions</h2>
  <div class="card" id="past"></div>
</section>

<section id="t-try">
  <h2 id="tryhead">Tryout</h2>
  <div class="card" id="tryout"></div>
  <h2>Dropped</h2>
  <div class="card" id="dropped"></div>
</section>

<section id="t-dash">
  <div id="dash"></div>
</section>

<section id="t-feed">
  <h2>Polymarket key &amp; feeds</h2>
  <div class="card" id="health"></div>
  <h2>Latest settled windows (champion &amp; tryout)</h2>
  <div class="card" id="recent"></div>
</section>

<nav class="tabs">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Overview</button>
  <button data-t="try"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20h4V10H4zm6 0h4V4h-4zm6 0h4v-7h-4z"/></svg>Tryout</button>
  <button data-t="dash"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>Dashboards</button>
  <button data-t="feed"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>Status</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const money=(v,d=2)=>v==null?"–":(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pl=(v,d=2)=>v==null?'<span class="muted">–</span>':`<span class="${v>0?"pos":v<0?"neg":"muted"}">${v>0?"+":""}${money(v,d)}</span>`;
const hm=t=>t?new Date(t*1000).toISOString().slice(11,16)+"Z":"–";
const mmss=s=>s==null?"–":s<=0?"due":(s>=3600?Math.floor(s/3600)+"h ":"")+Math.floor(s%3600/60)+"m "+String(Math.floor(s%60)).padStart(2,"0")+"s";
const coinName={btc:"BTC",eth:"ETH",sol:"SOL",xrp:"XRP"};
const NAMES={std:"Standard ($100)",dollar:"Dollar ($0.10–$10)",dollar30:"Dollar30 ($1,000)",dollar1000:"Dollar1000 ($30,000)",bonelab:"Bonereaper lab",top20:"Top 20 ($5,000)",evolve:"Evolve",champion:"Champion",tryout:"Tryout"};
let D=null,fetchedAt=0,tab="home";

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="t-"+tab));$("title").textContent=b.textContent.trim();scrollTo(0,0)});

function render(){
  if(!D)return;
  const age=(Date.now()/1000-D.ts), st=D.stream||{}, k=D.key||{};
  $("upd").innerHTML=`Updated ${hm(D.ts)} · ${age<15?"live":`<span class="stale">${Math.round(age)} s old</span>`}`;
  $("pills").innerHTML=[
    [k.accepted?"ok":k.set?"warn":"bad",k.accepted?"Key working":k.set?"Key set, stream down":"No key"],
    [st.connected?"ok":"bad",st.connected?`Stream · ${st.subscribed} markets`:"Stream offline"],
    [D.errors?"warn":"ok",`${D.errors} errors`],
  ].map(([c,t])=>`<span class="pill"><span class="dot ${c}"></span>${esc(t)}</span>`).join("");

  // champion
  const C=D.champion;
  if(C){
    const day=Object.entries(C.days||{}).slice(-1)[0], dayPl=day?day[1].pnl:null, eq=C.equity;
    let h=`<div class="hero"><div class="k">Bank</div><div class="big">${money(eq)}</div>
      <div class="kv"><span>Today (UTC)</span><b>${pl(dayPl)}</b></div>`;
    if(C.paused||!C.current) h+=`<div style="margin-top:10px"><span class="badge paused">PAUSED</span> <span class="small">Waiting for a bot to pass the tryout. Open positions: ${C.open}</span></div>`;
    else h+=`<div style="margin-top:10px"><b>${esc(C.current.key)}</b> <span class="small">since ${hm(C.current.hired)}</span></div>
      <div class="kv"><span>Since hired</span><b>${pl(C.pnl_since_hire)}</b></div><div class="kv"><span>Next review</span><b>${mmss(C.next_review_in)}</b></div>`;
    h+=`</div>`;
    $("champ").innerHTML=h;
    $("past").innerHTML=(C.history||[]).map(x=>`<div class="row"><div class="grow"><div class="name">${esc(x.key)}</div><div class="small">${x.fired?`${hm(x.hired)}–${hm(x.fired)} · ${esc(x.why||"replaced at review")}`:`hired ${hm(x.hired)} · kept at a review (nobody had passed)`}</div></div><div class="num">${pl(x.pnl)}</div></div>`).join("")||`<div class="row small">None yet</div>`;
  }
  // live windows
  $("live").innerHTML=["btc","eth","sol","xrp"].map(a=>{const m=(D.live||{})[a];if(!m)return `<div class="coin"><div class="t">${coinName[a]}</div><div class="small">No open window</div></div>`;
    const px=m.index??m.spot, bp=(px&&m.p2b)?(px-m.p2b)/m.p2b*1e4:null, left=Math.max(0,m.end-(D.ts+(Date.now()/1000-fetchedAt)));
    const up=m.p_up, side=up==null?"–":up>=.5?"Up":"Down";
    return `<div class="coin"><div class="t"><span>${coinName[a]}</span><span class="small">${mmss(left)}</span></div>
      <div class="lead ${bp==null?"":bp>=0?"pos":"neg"}">${bp==null?"–":(bp>=0?"+":"")+bp.toFixed(1)+" bp"}</div>
      <div class="kv"><span>To beat</span><b>${m.p2b==null?"–":m.p2b.toLocaleString()}</b></div>
      <div class="kv"><span>Now</span><b>${px==null?"–":px.toLocaleString()}</b></div>
      <div class="kv"><span>Up price</span><b>${m.bid==null?"–":Math.round(m.bid*100)}/${m.ask==null?"–":Math.round(m.ask*100)}¢</b></div>
      <div class="kv"><span>Model</span><b>${up==null?"–":side+" "+Math.round(Math.max(up,1-up)*100)+"%"}</b></div></div>`}).join("");
  // totals
  $("totals").innerHTML=(D.universes||[]).map(u=>`<div class="row"><div class="grow"><div class="name">${esc(NAMES[u.name]||u.name)}</div><div class="small">${u.bots} bots · ${u.up} up · ${u.down} down${u.top[0]?` · best ${esc(u.top[0].name)}`:""}</div></div><div class="num">${pl(u.net,0)}</div></div>`).join("");

  // tryout
  const T=D.tryout;
  if(T){
    $("tryhead").textContent=`Tryout · ${T.members.length} bots · review in ${mmss(T.next_review_in)}`;
    $("tryout").innerHTML=T.members.map(m=>{const pct=Math.min(100,(m.n||0)/T.min_windows*100);
      return `<div class="row"><div class="grow"><div class="name">${esc(m.name)} ${m.passed?'<span class="badge pass">PASS</span>':""}</div>
        <div class="small">${m.n}/${T.min_windows} windows · edge ${m.edge==null?"–":(m.edge>=0?"+":"")+(m.edge*100).toFixed(1)+"¢"} · ${m.coins_up||0}/4 coins up</div>
        <div class="bar"><i style="width:${pct}%"></i></div>${(r=>!m.passed&&r.length?`<div class="why">Needs: ${esc(r.join(" · "))}</div>`:"")((m.why||[]).filter(w=>!/windows|coins/.test(w)))}</div>
        <div class="num">${pl(m.pnl)}</div></div>`}).join("");
    $("dropped").innerHTML=(T.dropped||[]).length?T.dropped.map(d=>`<div class="row"><div class="grow"><div class="name">${esc(d.key)}</div><div class="small">${hm(d.ts)} · ${esc(d.why)} · ${d.n} windows</div></div><div class="num">${pl(d.pnl)}</div></div>`).join(""):`<div class="row small">None yet</div>`;
  }
  // dashboards detail
  $("dash").innerHTML=(D.universes||[]).map(u=>`<h2>${esc(NAMES[u.name]||u.name)} · port ${u.port}</h2><div class="card">
    <div class="row"><div class="grow">Net P/L <span class="small">(${u.bots} bots, ${money(u.start_cash,0)} each)</span></div><div class="num">${pl(u.net,0)}</div></div>
    ${u.top.map((b,i)=>`<div class="row"><div class="grow"><div class="name">${i+1}. ${esc(b.name)}</div><div class="small">${b.settled??0} windows · ${b.won??0} won</div></div><div class="num">${pl(b.pnl)}</div></div>`).join("")}
    ${u.worst.map(b=>`<div class="row"><div class="grow"><div class="name muted">Worst: ${esc(b.name)}</div></div><div class="num">${pl(b.pnl)}</div></div>`).join("")}</div>`).join("");

  // status
  const F=D.feeds||{}, X=D.crosscheck||{};
  $("health").innerHTML=[
    ["Polymarket key",k.accepted?"Working: signed market stream accepted":k.set?"Set, but the stream is not connected":"Not set",k.accepted?"ok":k.set?"warn":"bad"],
    ["Market stream",st.connected?`${(st.msgs||0).toLocaleString()} messages · last ${st.age}s ago · ${st.errors} drops`:"Offline",st.connected?"ok":"bad"],
    ["Settlement index",F.index_age==null?"–":`updated ${F.index_age}s ago`,F.index_age!=null&&F.index_age<10?"ok":"warn"],
    ["Coinbase spot",F.coinbase_connected?"connected":"offline",F.coinbase_connected?"ok":"bad"],
    ["Order books polled",F.books_polled??"–","ok"],
    ["BRTI cross-check",X.ok?`${X.compared} s compared · median diff ${X.median_abs_diff}`:"–",X.ok?"ok":"warn"],
    ["Engine",`up ${mmss(D.uptime)} · ${D.errors} errors · loop ${D.loop}`,D.errors?"warn":"ok"],
  ].map(([a,b,c])=>`<div class="row"><span class="dot ${c}"></span><div class="grow"><div class="name">${esc(a)}</div><div class="small">${esc(b)}</div></div></div>`).join("");
  $("recent").innerHTML=(D.recent||[]).map(r=>`<div class="row"><div class="grow"><div class="name">${esc(r.bot)}</div><div class="small">${hm(r.ts)} · ${(coinName[r.asset]||r.asset)} ${esc(r.horizon)} · ${r.up?"Up":"Down"} won</div></div><div class="num">${pl(r.pnl_total)}</div></div>`).join("")||`<div class="row small">None yet</div>`;
}

async function load(){
  try{const r=await fetch("summary.json",{cache:"no-store"});D=await r.json();fetchedAt=Date.now()/1000;render()}
  catch(e){$("upd").innerHTML='<span class="stale">Cannot reach the bots right now (the session may be asleep). Retrying…</span>'}
}
load();setInterval(load,5000);setInterval(render,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
